name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Phase gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and property tests, with kernel coverage gate
        run: npm run test:coverage

      - name: Licence gate
        run: npm run license:check

      # Independent oracles: hatch areas (shapely) and exported DXF (ezdxf + shapely).
      # Both are test tools only; they are not part of the app.
      - name: Hatch areas and exported DXF against shapely and ezdxf
        run: |
          python3 -m venv "$RUNNER_TEMP/oracle"
          "$RUNNER_TEMP/oracle/bin/pip" install --quiet shapely==2.2.0 ezdxf==1.4.3
          "$RUNNER_TEMP/oracle/bin/python" tests/oracle/check_hatch_areas.py
          EXPORT_DIR="$RUNNER_TEMP/exports" npx vitest run tests/unit/io/emit-oracle.test.ts
          "$RUNNER_TEMP/oracle/bin/python" tests/oracle/check_exports.py "$RUNNER_TEMP/exports"

      - name: Brand guard
        run: npm run brand:check

      - name: Build
        run: npm run build

      - name: Size budget
        run: npm run size:check

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Browser tests (GPU disabled)
        run: npm run test:e2e

      # The report artifact can't be downloaded from the cloud workspace, so failed
      # screenshots are also printed here as base64 PNGs, readable through the logs API.
      - name: Print failed screenshots to the log
        if: failure()
        run: |
          find test-results -name '*-actual.png' -o -name '*-diff.png' | sort | while read -r f; do
            echo "::group::screenshot $f"
            base64 -w 1000 "$f"
            echo "::endgroup::"
          done

      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
