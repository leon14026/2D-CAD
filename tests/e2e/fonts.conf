<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Font setup for the browser tests (playwright.config.ts points Chromium at this file).

  Chromium on Linux asks fontconfig which system fonts to use and how to smooth text, and
  every machine answers differently: the cloud workspace and GitHub's runners disagree on
  hinting and on font substitutes, which made the whole-window screenshot differ by
  6,385 pixels in CI. With this file, text renders the same way everywhere.

  ArchiLite's own text is B612, a web font that doesn't come from fontconfig, but these
  settings still decide how it is smoothed. The only system fonts left are Liberation
  (Ubuntu package fonts-liberation, which Playwright's dependency install provides);
  the key labels use Liberation Mono.
-->
<fontconfig>
  <dir>/usr/share/fonts/truetype/liberation</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>

  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>

  <!-- Greyscale smoothing with no hinting: the same on any machine. -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
