<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="%APP_NAME%: a lightweight, browser-based 2D CAD application for engineering drawings." />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAyMCAyMCc+PHJlY3QgeD0nMi41JyB5PScyLjUnIHdpZHRoPScxNScgaGVpZ2h0PScxNScgcng9JzInIGZpbGw9JyNmNWY2ZjYnIHN0cm9rZT0nIzFkMmEzMycgc3Ryb2tlLXdpZHRoPScxLjYnLz48cGF0aCBkPSdNNSAxNSAxNSA1JyBzdHJva2U9JyMyYTNmYjAnIHN0cm9rZS13aWR0aD0nMS42JyBzdHJva2UtbGluZWNhcD0ncm91bmQnLz48Y2lyY2xlIGN4PScxMCcgY3k9JzEwJyByPScyJyBmaWxsPScjMmEzZmIwJy8+PC9zdmc+" />
    <title>%APP_NAME%</title>
  </head>
  <body>
    <header class="al-bar">
      <div class="al-brand">
        <svg class="al-mark" viewBox="0 0 20 20" aria-hidden="true">
          <rect x="2.5" y="2.5" width="15" height="15" rx="2" fill="#f5f6f6" stroke="#1d2a33" stroke-width="1.6" />
          <path d="M5 15 15 5" stroke="#2a3fb0" stroke-width="1.6" stroke-linecap="round" />
          <circle cx="10" cy="10" r="2" fill="#2a3fb0" />
        </svg>
        <span id="al-name">%APP_NAME%</span>
      </div>
      <div class="al-doc">
        <span id="al-title" class="al-doc-title">Untitled</span>
        <span id="al-dirty" class="al-dirty" title="Unsaved changes" hidden></span>
        <span id="al-file-name" class="al-doc-file"></span>
      </div>
      <span class="al-spacer"></span>
      <button id="al-search" class="al-button al-search" type="button" aria-keyshortcuts="Control+K">
        <span>Search commands</span><kbd>Ctrl K</kbd>
      </button>
      <div class="al-group" id="al-history"></div>
      <div class="al-group" id="al-file-actions"></div>
      <input id="al-file" type="file" accept=".archilite,.json,.dxf,application/json" hidden />
    </header>

    <aside id="al-layers-panel" class="al-side al-side-left" aria-label="Layers"></aside>

    <main id="al-stage" class="al-stage">
      <canvas id="al-canvas" aria-hidden="true"></canvas>
      <canvas id="al-overlay" aria-label="Drawing area"></canvas>
      <nav id="al-tools" class="al-rail" aria-label="Tools"></nav>
      <div id="al-entry" class="al-entry" hidden></div>
      <div id="al-empty" class="al-empty" hidden></div>
    </main>

    <aside id="al-selection-panel" class="al-side al-side-right" aria-label="Selection"></aside>

    <section id="al-script-panel" class="al-script" aria-label="Script"></section>

    <footer class="al-status">
      <div class="al-coords" aria-label="Cursor position">
        <span>X <output id="al-coord-x">0.000</output></span>
        <span>Y <output id="al-coord-y">0.000</output></span>
        <button id="al-units" class="al-status-toggle" type="button" title="These numbers are millimetres. Click to treat them as centimetres without scaling.">mm</button>
      </div>
      <button id="al-sheet" class="al-status-toggle" type="button" title="Switch sheet">Sheet 1</button>
      <span id="al-scale" title="Drawing scale on a 96 dpi screen"></span>
      <span id="al-count"></span>
      <button id="al-grid-toggle" class="al-status-toggle" type="button" aria-pressed="true">Grid</button>
      <button id="al-weight-toggle" class="al-status-toggle" type="button" aria-pressed="true">Lineweights</button>
      <button id="al-snap-toggle" class="al-status-toggle" type="button" aria-pressed="true" title="Snap to exact points on the drawing (Shift S)">Snaps</button>
      <button id="al-ortho-toggle" class="al-status-toggle" type="button" aria-pressed="false" title="Horizontal and vertical only (Shift O, or hold Shift)">Ortho</button>
      <button id="al-polar-toggle" class="al-status-toggle" type="button" aria-pressed="true" title="Follow lines at set angles from the last point (Shift T)">Tracking</button>
      <span class="al-spacer"></span>
      <span class="al-pill">Phase 12: live DXF dimensions</span>
      <a class="al-status-link" href="./inspect.html">File inspector</a>
      <span id="al-build"></span>
    </footer>

    <div id="al-toast" class="al-toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
